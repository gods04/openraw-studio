name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Verify prebuilt HE CPU kernels
        run: python -c "from openraw_studio.raw.native import he_cpu; assert he_cpu.extension is not None, he_cpu.import_error"

      - name: Run HE tests without the optional extension
        env:
          OPENRAW_HE_AOT: "off"
        run: python -m unittest discover -s tests -p 'test_nikon_he*.py'

      - name: Check CLI entry point
        run: |
          openraw --version
          openraw doctor

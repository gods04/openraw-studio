[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openraw-studio"
version = "0.1.0"
description = "Local-first computational photography application foundation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "gods04" }
]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "numba>=0.61",
  "pyopencl>=2024.3",
  "tifffile==2026.3.3",
]

[project.scripts]
openraw = "openraw_studio.cli:main"

[project.optional-dependencies]
dev = []
scene = ["onnxruntime==1.30.0"]
packaging = [
  "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openraw_studio.ui" = ["icons/*.png", "icons/LICENSE.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
